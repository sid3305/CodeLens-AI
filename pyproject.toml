[project]
name = "codelens-ai"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --ignore=tests/fixtures"

[tool.ruff]
target-version = "py310"
extend-exclude = [
    "frontend",
    ".review-scratch",
    # Deliberately flawed files that the analyzer tests run against.
    "tests/fixtures",
]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts; tests may use private members of the code under test.
"tests/**" = ["S101", "SLF001", "PLR2004"]
