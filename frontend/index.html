<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeLens AI: explore a repository's structure and dependencies, check it with static analyzers and understand it with AI. Runs locally." />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the theme before first paint (no flash of the wrong theme).
      // Mirrors src/theme/theme.ts; storage may be unavailable.
      ;(function () {
        var preference = 'system'
        try {
          var stored = window.localStorage.getItem('codelens-theme')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch (error) {}
        var dark = preference === 'dark' ||
          (preference === 'system' && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        // Same colours as applyTheme() in src/theme/theme.ts.
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0e1116' : '#f6f7f9')
      })()
    </script>
    <title>CodeLens AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
